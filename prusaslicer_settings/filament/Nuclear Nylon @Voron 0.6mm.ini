filament_notes = "Atomic Filament Carbon Fiber Nuclear Nylon v3, Voron 0.6mm nozzle. As of 2026-10 Atomic only sells a CF version of Nuclear Nylon: an alloyed PA copolymer with adhesion promoters, impact modifiers and milled carbon fiber.\n\nABRASIVE: the Diamondback 0.6mm is fine. Vendor says 0.5mm nozzle minimum, 0.6mm recommended.\n\nDRY IT: vendor says store dry and print dry (dry box or sealed enclosure during printing; spool ships with a moisture indicator card). Popping or crackling at the nozzle means it is wet. Wet nylon is the most common cause of stringing, jams and rough surfaces, independent of any setting here.\n\nVendor spec (product page): nozzle 265-285C, bed 60C on glass with PVA or Magigoo or other nylon-friendly surface, speed 35-45 mm/s (a slow-printer figure; ignored). No fan, chamber, retraction or max volumetric guidance published. TDS: density 1.17, HDT 177C at 66 psi, tensile 17 ksi, modulus 1.1 Mpsi, elongation at break 3.3% (very stiff; thin features will be brittle). SDS: decomposition 300C, so do not run the temp tower above 290.\n\nFan off, bed 60 and the 2000 accel ceiling follow the PA6-CF-GF preset and general CF-nylon practice. Glue stick on PEI if corners lift.\n\nRetraction deliberately stays at the printer default 0.8mm: on a short-melt-zone direct drive (G2E + Rapido 2) long nylon retractions pull molten material into the heatbreak and pack fibers there. Tune 0.4-1.2 in Orca's retraction test.\n\nUNCALIBRATED (all seeds): nozzle temp 280, flow ratio 0.97, max volumetric 12, pressure advance 0.02 (set in start_filament_gcode), retraction 0.8. Order: temp tower (265-285), flow ratio, PA, max flowrate, retraction.\n\nOrca counterpart: 'Nuclear Nylon @Voron 0.6mm'."
