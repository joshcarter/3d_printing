filament_notes = "Polymaker Fiberon PA6-CF20 and PA6-GF25, Voron 0.6mm nozzle. One preset for both: the vendor print settings are identical. Split it if calibration gives different PA or flow values.\n\nABRASIVE: the Diamondback 0.6mm is fine.\n\nDRY IT: Polymaker says print straight from a heated dryer the whole time (anneal/dry at 100C). Popping or crackling at the nozzle means it is wet. Wet nylon is the most common cause of stringing, jams, and rough surfaces, independent of any setting here.\n\nVendor spec (TDS, same for both): nozzle 280-300C, bed 40-50C (do not exceed 50C; Warp-Free formula), chamber room temp, cooling fan 0%, speed 30-300 mm/s, direct-drive retraction 3mm @ 40mm/s. Density 1.17 (CF20) / 1.2 (GF25); 1.17 used here. No max volumetric figure published. Glue stick or Magigoo PA if adhesion is poor. Anneal parts 100C for 16h, then moisture-condition.\n\nRetraction deliberately ignores the vendor 3mm: on a short-melt-zone direct drive (G2E + Rapido 2) it pulls molten nylon into the heatbreak and packs fibers there. 0.8mm matches the printer default; tune 0.4-1.2 in Orca's retraction test.\n\nUNCALIBRATED (all seeds): nozzle temp 290, extrusion multiplier 1.0, max volumetric 12, pressure advance 0.02 (set in start_filament_gcode), retraction 0.8. Order: temp tower (280-300), flow ratio, PA, max flowrate, retraction.\n\nReplaces 'PA6 @Voron' for these filaments. That preset was 0.4mm, with 3mm retraction, a 0.76 extrusion multiplier, and fan enabled.\n\nOrca counterpart: 'PA6-CF-GF @Voron 0.6mm'."
