[include shell_command.cfg]
# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 350mm BigTreeTech OctoPus V1 TMC2209 UART config
## Nozzle: 0.400mm

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch offset for Z0       [stepper_z] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner positions    [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section

[include mainsail.cfg]

# Enables M486 / exclude_object support for Mainsail's object cancellation.
[exclude_object]

# Enables G2/G3 arc commands. Not required, but some slicers emit arcs and
# this makes arcs interpolate smoothly rather than being rejected.
[gcode_arcs]
resolution: 0.1

[force_move]
enable_force_move: True

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_240039000150335331383520-if00
restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 300
# max_accel is the HARD CEILING. The slicer can (and should) command lower
# values per-filament via M204. 4000 is the Voron reference maximum for the 350.
max_accel: 4000
max_z_velocity: 25          # 24V TMC drivers can handle this fine
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400  # 0.9deg LDO stepper; set to 200 for 1.8deg
endstop_pin: PG6
position_min: 0
##--------------------------------------------------------------------

##  Uncomment below for 250mm build
#position_endstop: 250
#position_max: 250

##  Uncomment for 300mm build
#position_endstop: 300
#position_max: 300

##  Uncomment for 350mm build
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 25   # Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false          # Voron reference setting
run_current: 0.9            # Modest bump over 0.8 stock; well within LDO 2A motor thermal spec
sense_resistor: 0.110
stealthchop_threshold: 0    # SpreadCycle always (required for XY torque at speed)

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400  # 0.9deg LDO stepper; set to 200 for 1.8deg
endstop_pin: PG9
position_min: 0
##--------------------------------------------------------------------

##  Uncomment for 250mm build
#position_endstop: 250
#position_max: 250

##  Uncomment for 300mm build
#position_endstop: 300
#position_max: 300

##  Uncomment for 350mm build
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 25  # Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false          # Voron reference setting
run_current: 0.9            # Modest bump over 0.8 stock
sense_resistor: 0.110
stealthchop_threshold: 0    # SpreadCycle always

#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: PG10
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
##--------------------------------------------------------------------

##  Uncomment below for 250mm build
#position_max: 210

##  Uncomment below for 300mm build
#position_max: 260

##  Uncomment below for 350mm build
position_max: 310

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999  # StealthChop for quieter Z moves

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999


#####################################################################
#   Extruder
#####################################################################

##  Connected to MOTOR_6
##  Heater - changed to bed heater, was HE0
##  Thermistor - T0
[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
rotation_distance: 47.0888 # G2E value, CW2 was 22.6789511 for Bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
gear_ratio: 9:1 # G2E, CW2 was 50:10
microsteps: 16  # G2E, CW2 was 32
full_steps_per_rotation: 200    # 1.8deg extruder stepper
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PA1
sensor_type: PT1000 # Rapido 2; Revo was ATC Semitec 104NT-4-R025H42G
pullup_resistor: 4700
# inline_resistor: 4740 # suggested by Grok for octopus v1.1 w/ PT1000, but does not work
sensor_pin: PF4
min_temp: 10
max_temp: 350
max_power: 0.7 # Rapido 2: limit this
min_extrude_temp: 170
# Allow long extrusions for e-steps calibration
max_extrude_only_distance: 150
# Generous cross-section limit so slicer intro/purge lines don't trip Klipper.
# Default is tight and can fail on wide purge lines, especially with 0.6mm nozzle.
max_extrude_cross_section: 5
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##  Default pressure_advance. This is overridden per-filament by the slicer
##  via SET_PRESSURE_ADVANCE, so treat this as a fallback only.
pressure_advance: 0.03
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040

##  E0 on MOTOR6
[tmc2209 extruder]
uart_pin: PE1
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Bed Heater
#####################################################################


##  SSR Pin - moved to HE0 (extruder heater)
##  Thermistor - TB
[heater_bed]
heater_pin: PA2
##  Validate the following thermistor type to make sure it is correct
##  Keenovo branded bed heaters should use Generic 3950
##  LDO branded bed heaters will have the sensor type labelled on the heater
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 0.7
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

# Thermal runaway protection for the bed. Values relaxed from defaults so a
# cold-start in a cool room doesn't falsely trip. A failed heater still won't
# produce 10C of rise in 3 minutes, so the safety margin is intact.
[verify_heater heater_bed]
check_gain_time: 180
hysteresis: 10

#####################################################################
#   Probe
#####################################################################

##  Inductive Probe (Klicky)
##  This probe is not used for Z height, only Quad Gantry Leveling
[probe]
pin: PG15
x_offset: 0
y_offset: 25.0
#z_offset: 0
speed: 10.0
samples: 5
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.02
samples_tolerance_retries: 5

#####################################################################
#   Fan Control
#####################################################################

##  Print Cooling Fan - FAN0
[fan]
pin: PA8
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10


##  Hotend Fan - FAN1
[heater_fan hotend_fan]
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

##  Controller fan - FAN2
[controller_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed, extruder
fan_speed: 1.0

##  Exhaust fan - FAN3
[heater_fan exhaust_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 60
fan_speed: 1.0

#####################################################################
#   LED Control
#####################################################################

[output_pin caselight]
## Chamber Lighting - CNC_FAN5
pin: PD15
pwm: true
shutdown_value: 0
value: 0
cycle_time: 0.01

[neopixel headlight]
## Stealthburner lighting - RGB_LED
pin: PB0
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[include stealthburner_leds.cfg]

#####################################################################
#   Additional Sensors
#####################################################################

[temperature_sensor chamber_temp]
## Chamber Temperature - T1
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF5
min_temp: 0
max_temp: 100
gcode_id: chamber_th

# Expose the Raspberry Pi's temperature in Mainsail for monitoring.
# [temperature_sensor raspberry_pi]
# sensor_type: temperature_host
# min_temp: 0
# max_temp: 100

# Expose the Octopus MCU temperature.
# [temperature_sensor mcu_temp]
# sensor_type: temperature_mcu
# min_temp: 0
# max_temp: 100

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update with the XY coordinates of your endstop pin
##  after going through Z Endstop Pin Location Definition step.
home_xy_position: 232,350
speed: 100
z_hop: 10
z_hop_speed: 10


##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]

#--------------------------------------------------------------------
gantry_corners:
   -60,-10
   410,420
points:
   50,25
   50,275
   300,275
   300,25

#--------------------------------------------------------------------
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.02
max_adjust: 10

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

#####################################################################
#   Displays
#####################################################################

#[display]
##  mini12864 LCD Display
#lcd_type: uc1701
#cs_pin: EXP1_3
#a0_pin: EXP1_4
#rst_pin: EXP1_5
#encoder_pins: ^EXP2_5, ^EXP2_3
#click_pin: ^!EXP1_2
#contrast: 63
#spi_software_miso_pin: EXP2_1
#spi_software_mosi_pin: EXP2_6
#spi_software_sclk_pin: EXP2_2

#[neopixel btt_mini12864]
##  To control Neopixel RGB in mini12864 display
#pin: EXP1_6
#chain_count: 3
#initial_RED: 0.1
#initial_GREEN: 0.5
#initial_BLUE: 0.0
#color_order: RGB

###  Set RGB values on boot up for each Neopixel.
###  Index 1 = display, Index 2 and 3 = Knob
#[delayed_gcode setdisplayneopixel]
#initial_duration: 1
#gcode:
#        SET_LED LED=btt_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
#        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
#        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3

#--------------------------------------------------------------------

#####################################################################
#   Secondary MCU host for input shaper calibration
#####################################################################


[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20


#####################################################################
#   Macros
#####################################################################

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X175 Y175 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32


#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
[gcode_macro PRINT_START]
gcode:
    # Slicer-provided parameters
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default(0)|int %}
    {% set soak = params.SOAK|default(0)|int %}  # chamber soak time in minutes

    # Pre-heat hotend to 50C below target: below ooze point for most filaments,
    # but gets us close enough that the final ramp is quick.
    {% set preheat_extruder = target_extruder - 50 %}

    SET_PIN PIN=caselight VALUE=1
    STATUS_HOMING
    SET_DISPLAY_TEXT MSG="Homing"

    # Kick off bed heating (slowest thermal mass) and partial hotend heat simultaneously
    M140 S{target_bed}
    M104 S{preheat_extruder}

    # Cold home; Z will be re-homed once hot since the frame expands
    G28

    # Park over bed center so the hotend soaks in radiant heat while bed warms
    G90
    G1 X175 Y175 Z20 F9000

    # Wait for bed to reach target (the main wait)
    STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target_bed - 2}

    # Optional chamber soak dwell (set SOAK in minutes from slicer)
    {% if soak > 0 %}
        SET_DISPLAY_TEXT MSG="Soak: {soak}min"
        G4 P{soak * 60 * 1000}
    {% endif %}

    # QGL with hotend at partial temp - minimal ooze during probing
    SET_DISPLAY_TEXT MSG="QGL"
    QUAD_GANTRY_LEVEL

    # Re-home Z with frame at operating temperature
    G28 Z

    # Full hotend target - fast since we pre-heated
    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
    M104 S{target_extruder}
    G1 X175 Y175 Z30 F9000
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_extruder - 2} MAXIMUM={target_extruder + 5}

    # Priming line
    G90
    G1 X2 Y2 Z15 F9000
    G92 E0.0
    G1 Z0.3 F1000.0
    G1 X60.0 E9.0 F1000.0
    G1 X250.0 E35.0 F500.0
    G92 E0.0

    STATUS_PRINTING
    SET_NOZZLE_LEDS_ON


#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament

    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    BED_MESH_CLEAR
    SET_PIN PIN=caselight VALUE=0
    SET_NOZZLE_LEDS_OFF
    STATUS_OFF
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

[gcode_macro TEST_SPEED]
gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}

    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = printer.toolhead.axis_minimum.y + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}

    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}

        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED

    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }

    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %}
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}

        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}

        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}

        # Small patternbox
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED

[gcode_macro LOAD_FILAMENT]
description: Loads filament into the toolhead
variable_load_distance:  50
variable_purge_distance: 50
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
    {% set min_temp = printer.configfile.settings['extruder'].min_extrude_temp %}

    {% if printer.extruder.temperature < min_temp %}
        { action_raise_error("Extruder too cold (%.0f°C). Heat to at least %d°C before loading."
            % (printer.extruder.temperature, min_temp)) }
    {% else %}
        SAVE_GCODE_STATE NAME=load_state
        M83                                       # relative extrusion
        G92 E0
        G1 E{load_distance} F{max_velocity}       # quick load through the gears into the melt zone
        G1 E{purge_distance} F{speed}             # slower purge to clear old material
        G92 E0
        RESTORE_GCODE_STATE NAME=load_state
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unloads filament from the toolhead
variable_unload_distance: 90
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
    {% set min_temp = printer.configfile.settings['extruder'].min_extrude_temp %}

    {% if printer.extruder.temperature < min_temp %}
        { action_raise_error("Extruder too cold (%.0f°C). Heat to at least %d°C before unloading."
            % (printer.extruder.temperature, min_temp)) }
    {% else %}
        SAVE_GCODE_STATE NAME=unload_state
        M83
        G92 E0
        G1 E{purge_distance} F{speed}             # short extrude to soften and form a clean tip
        G1 E-2 F{speed * 4}                       # quick tip-shaping retract
        G1 E2 F{speed}
        G1 E-{unload_distance} F{max_velocity}    # retract clear of the extruder gears
        G92 E0
        RESTORE_GCODE_STATE NAME=unload_state
    {% endif %}

[gcode_shell_command anneal_log]
command: /home/pi/anneal_log.sh
timeout: 5.
verbose: False

[gcode_macro ANNEAL]
description: Anneal samples - usage: ANNEAL NAME=run1 TEMP=100 HOURS=28
variable_elapsed_s: 0
variable_target_s: 0
variable_target_temp: 0
variable_run_name: ""
gcode:
    {% if 'NAME' not in params %}
        { action_raise_error("ANNEAL requires a NAME parameter") }
    {% endif %}
    {% set NAME = params.NAME %}
    {% set TEMP = params.TEMP|default(100)|float %}
    {% set HOURS = params.HOURS|default(28)|float %}
    SET_GCODE_VARIABLE MACRO=ANNEAL VARIABLE=elapsed_s VALUE=0
    SET_GCODE_VARIABLE MACRO=ANNEAL VARIABLE=target_s VALUE={(HOURS * 3600)|int}
    SET_GCODE_VARIABLE MACRO=ANNEAL VARIABLE=target_temp VALUE={TEMP}
    SET_GCODE_VARIABLE MACRO=ANNEAL VARIABLE=run_name VALUE="'{NAME}'"
    SET_IDLE_TIMEOUT TIMEOUT={(HOURS * 3600 + 14400)|int}
    RUN_SHELL_COMMAND CMD=anneal_log PARAMS="{NAME} start {printer.heater_bed.temperature|round(2)} {TEMP}"
    M117 Anneal heat-up to {TEMP}C
    M140 S{TEMP}
    M190 S{TEMP}
    M84
    M117 Anneal hold {HOURS}h at {TEMP}C
    UPDATE_DELAYED_GCODE ID=_anneal_hold_poll DURATION=60

[delayed_gcode _anneal_hold_poll]
gcode:
    {% set elapsed = printer["gcode_macro ANNEAL"].elapsed_s|int + 60 %}
    {% set target = printer["gcode_macro ANNEAL"].target_s|int %}
    {% set target_t = printer["gcode_macro ANNEAL"].target_temp|float %}
    {% set name = printer["gcode_macro ANNEAL"].run_name %}
    {% set bed = printer.heater_bed.temperature|float %}
    SET_GCODE_VARIABLE MACRO=ANNEAL VARIABLE=elapsed_s VALUE={elapsed}
    RUN_SHELL_COMMAND CMD=anneal_log PARAMS="{name} hold {bed|round(2)} {target_t}"
    {% if elapsed >= target %}
        M140 S0
        M117 Cooling - bed off
        UPDATE_DELAYED_GCODE ID=_anneal_cooldown_check DURATION=60
    {% else %}
        {% set remaining_h = ((target - elapsed) / 3600.0)|round(2) %}
        M117 Anneal {remaining_h}h left {bed|round(1)}C
        UPDATE_DELAYED_GCODE ID=_anneal_hold_poll DURATION=60
    {% endif %}

[delayed_gcode _anneal_cooldown_check]
gcode:
    {% set name = printer["gcode_macro ANNEAL"].run_name %}
    {% set target_t = printer["gcode_macro ANNEAL"].target_temp|float %}
    {% set bed = printer.heater_bed.temperature|float %}
    RUN_SHELL_COMMAND CMD=anneal_log PARAMS="{name} cooldown {bed|round(2)} {target_t}"
    {% if bed > 50 %}
        M117 Cooling: bed {bed|round(1)}C
        UPDATE_DELAYED_GCODE ID=_anneal_cooldown_check DURATION=60
    {% else %}
        M117 Anneal complete - remove parts
        RUN_SHELL_COMMAND CMD=anneal_log PARAMS="{name} complete {bed|round(2)} {target_t}"
        SET_GCODE_VARIABLE MACRO=ANNEAL VARIABLE=run_name VALUE="''"
        SET_IDLE_TIMEOUT TIMEOUT=1800
    {% endif %}

[gcode_macro ANNEAL_ABORT]
description: Abort active anneal cycle
gcode:
    {% set name = printer["gcode_macro ANNEAL"].run_name %}
    {% set target_t = printer["gcode_macro ANNEAL"].target_temp|float %}
    {% set bed = printer.heater_bed.temperature|float %}
    UPDATE_DELAYED_GCODE ID=_anneal_hold_poll DURATION=0
    UPDATE_DELAYED_GCODE ID=_anneal_cooldown_check DURATION=0
    M140 S0
    SET_IDLE_TIMEOUT TIMEOUT=1800
    {% if name != "" %}
        RUN_SHELL_COMMAND CMD=anneal_log PARAMS="{name} aborted {bed|round(2)} {target_t}"
        SET_GCODE_VARIABLE MACRO=ANNEAL VARIABLE=run_name VALUE="''"
    {% endif %}
    M117 Anneal aborted

